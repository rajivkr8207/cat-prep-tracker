name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  fullstack-build:
    name: full stack CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build Production
        run: npm run build
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/cat_exam_tracker_ci
          JWT_ACCESS_SECRET: ci-only-access-secret-placeholder
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ci-only-refresh-secret-placeholder
          JWT_REFRESH_EXPIRES_IN: 7d
          NODE_ENV: production

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [fullstack-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t cat-exam-tracker:ci .